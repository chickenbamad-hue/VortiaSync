<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | VortiaSync</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="VortiaSync Logo" id="nav-logo">
            </a>
            <div class="menu-toggle" id="mobile-menu">&#9776;</div>
            <nav id="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="pricing.html">Pricing</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </div>
    </header>

    <section class="contact-section">
        <div class="section-header">
            <h2>Let's Build Something</h2>
            <p>Ready to start? Send us a message and we'll reply within 24 hours.</p>
        </div>
        
        <div class="form-container">
            <!-- Replace YOUR_FORM_ID with your Formspree ID -->
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="service">Service Interested In</label>
                    <select id="service" name="service">
                        <option value="website-creation">Website Creation</option>
                        <option value="management">Website Management</option>
                        <option value="automation">Automations</option>
                        <option value="tools">Custom Tools</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="message">Project Details</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-full">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 VortiaSync.co.uk. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
